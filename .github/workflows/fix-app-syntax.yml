name: Fix app.js syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix missing closing parenthesis
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = "</a></section></main>'));\n"
          new = "</a></section></main>')));\n"
          if old not in s:
              print('No legacy syntax error found; nothing to change.')
          else:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one target, found {s.count(old)}')
              p.write_text(s.replace(old, new, 1))
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix app.js missing closing parenthesis"
            git push
          fi
